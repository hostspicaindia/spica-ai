# Spica AI - Training config (1M-tier, 1-lakh-step run on vast.ai)
# 20000-step run (en/hi 500K/496K) plateaued -- val_loss flat 2.03-2.19 last
# ~5000 steps as cosine LR hit min_lr. Dataset limits raised in preprocess.py
# (en/hi 500K -> 2M each) for more variety; max_steps extended to 100000 so
# the resumed run (from step 20000) gets a long fresh decay tail on the RTX
# 5090 instance instead of sitting at min_lr. checkpoint_interval widened to
# 2500 (was 500) -- at 500 this would write 200 x ~247MB step_*.pt files
# (~49GB) over the full run; at 2500 it's 40 files (~10GB), safer for disk.

batch_size: 32
max_steps: 600000       # sized to ~7hr of an 8hr vast.ai RTX 5090 budget (0.0427s/step observed)
eval_interval: 500      # run validation loss every N steps
eval_iters: 50          # average val loss over this many batches
log_interval: 1000      # print training loss every N steps

learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 500
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_1m"
checkpoint_interval: 25000
