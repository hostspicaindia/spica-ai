# Spica AI - SFT (instruction-tuning) config
# Fine-tunes an already-pretrained checkpoint on (prompt, response) pairs
# (src/data/sft_dataset.py masks loss to response tokens only). Much
# smaller learning_rate than pretraining -- SFT should nudge weights
# toward following instructions, not relearn language from scratch.
#
# First run (max_steps=3000, <1 epoch over the 50935-pair Alpaca set)
# showed the model correctly adopting the "### Response:" format but
# generating off-topic content -- format learned, content-conditioning
# not yet. LR schedule was also compressed into just 3000 steps, decaying
# to near-zero before that could consolidate. max_steps raised to 16000
# (~5 epochs, matches common Alpaca-finetune convention) so the cosine
# schedule spends real time at a useful LR instead of flatlining early.

train_data: "data/sft/train.jsonl"
val_data: "data/sft/val.jsonl"

batch_size: 16
max_steps: 16000         # ~5 epochs over 50935 pairs (50935/16 ~= 3183 steps/epoch)
eval_interval: 200
eval_iters: 20
log_interval: 200

learning_rate: 5.0e-5    # ~6x smaller than pretraining LR -- fine-tune, don't relearn
min_lr: 5.0e-6
warmup_steps: 300
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_10m_sft"
checkpoint_interval: 2000
