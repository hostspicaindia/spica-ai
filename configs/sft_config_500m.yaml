# Spica AI - SFT (instruction-tuning) config, 500M tier
#
# batch_size=4 matches this tier's own known-safe scale (4*block_size=1024
# = 4096 tokens/step) -- same value the 500M PRETRAIN config already uses,
# so no OOM risk here. (Contrast the 10M->100M mistake: reusing a smaller
# tier's SFT batch_size directly caused an immediate OOM because block_size
# had changed. Not repeating that here -- verified against model_500m.yaml's
# block_size=1024 before setting this.)
#
# max_steps sized for 2 EPOCHS (not 3, unlike the 100M tier) over the
# existing 382179-pair dataset: 382179/4 ~= 95545 steps/epoch * 2 ~= 191090,
# rounded to 191000. Deliberately fewer epochs than 100M's SFT run --
# 500M has more capacity to memorize the same templated data, and 3 epochs
# already showed early signs of repetition-loop overfitting at 100M scale
# (see PROGRESS.md section 7 tier notes). Watch val_loss during the run;
# extend from this checkpoint later if it looks underfit rather than
# gambling on 3 epochs upfront.
#
# At measured pretrain speed (~0.443s/step, from the 198000->199000 step
# log interval) this is ~191000*0.443s ~= 23.5hr -- roughly matches the
# pretrain run's own ~26hr budget.
#
# checkpoint_interval=25000 -> ceil(191000/25000)=8 step_*.pt files +
# 1 latest.pt = 9 files. Checkpoints at this tier are ~8.25GB EACH (same
# model size as pretrain: ~2.75GB weights + ~5.5GB fresh AdamW optimizer
# state) -> ~74.25GB. Check free disk before starting if the base
# pretrain checkpoint(s) are still sitting on the same instance.

train_data: "data/sft/train.jsonl"
val_data: "data/sft/val.jsonl"

batch_size: 4               # matches 500M's safe scale (4*1024=4096 tokens/step)
max_steps: 191000           # ~2 epochs over 382179 pairs at batch_size 4
eval_interval: 1500
eval_iters: 20
log_interval: 1500

learning_rate: 5.0e-5        # ~6x smaller than pretraining LR -- fine-tune, don't relearn
min_lr: 5.0e-6
warmup_steps: 3000
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_500m_sft"
checkpoint_interval: 25000
