# Spica AI - SFT (instruction-tuning) config, 500M tier
#
# batch_size=4 matches this tier's own known-safe scale (4*block_size=1024
# = 4096 tokens/step) -- same value the 500M PRETRAIN config already uses,
# so no OOM risk here. (Contrast the 10M->100M mistake: reusing a smaller
# tier's SFT batch_size directly caused an immediate OOM because block_size
# had changed. Not repeating that here -- verified against model_500m.yaml's
# block_size=1024 before setting this.)
#
# RESCALED (2026-08-25) after the first SFT run's test results surfaced
# two real bugs (NAME_1/NAME_2 placeholder leakage, no model identity) and
# a real gap (zero Hinglish data) -- see PROGRESS.md. prepare_sft.py now
# filters the leakage and adds Hinglish conversations (200K, subsampled
# from Abhishekcr448/Hinglish-Everyday-Conversations-1M) + synthetic
# identity Q&A (540, oversampled 3x). Actual dataset after these changes:
# 549101 train pairs (up from 382179 -- filtering removed ~30K leaked
# rows, adding ~200540 new ones netted this).
#
# max_steps still sized for 2 EPOCHS (same reasoning as before -- 500M's
# capacity to overfit a templated set, watch val_loss rather than assume
# 3 epochs is safe): 549101/4 ~= 137275 steps/epoch * 2 ~= 274550.
# warmup_steps scaled proportionally from the original run's ratio
# (3000/191000 ~= 1.57%) -> 274550*0.0157 ~= 4300.
#
# At the first SFT run's measured rate (~0.41s/step) this is
# ~274550*0.41s ~= 31.3hr. This instance's DLPerf benchmark is ~10% lower
# than the one that ran the first SFT (178.0 vs 198.9, QEMU-virtualized
# RTX5090 vs bare-metal) -- actual per-step time may run a bit slower,
# recalibrate off the first few hundred steps' logged elapsed time rather
# than trusting this estimate blindly.
#
# checkpoint_interval=25000 -> ceil(274550/25000)=11 step_*.pt files +
# 1 latest.pt = 12 files * ~8.25GB = ~99GB. This instance has 250GB disk,
# still safe, but don't let old step_*.pt files pile up uninspected --
# same backup-then-delete discipline as before once a checkpoint is
# verified safely backed up locally.

train_data: "data/sft/train.jsonl"
val_data: "data/sft/val.jsonl"

batch_size: 4               # matches 500M's safe scale (4*1024=4096 tokens/step)
max_steps: 274550           # ~2 epochs over 549101 pairs at batch_size 4
eval_interval: 1500
eval_iters: 20
log_interval: 1500

learning_rate: 5.0e-5        # ~6x smaller than pretraining LR -- fine-tune, don't relearn
min_lr: 5.0e-6
warmup_steps: 4300
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_500m_sft"
checkpoint_interval: 25000
