# Spica AI - SFT (instruction-tuning) config, 500M tier
#
# batch_size=4 matches this tier's own known-safe scale (4*block_size=1024
# = 4096 tokens/step) -- same value the 500M PRETRAIN config already uses,
# so no OOM risk here. (Contrast the 10M->100M mistake: reusing a smaller
# tier's SFT batch_size directly caused an immediate OOM because block_size
# had changed. Not repeating that here -- verified against model_500m.yaml's
# block_size=1024 before setting this.)
#
# RESCALED (2026-08-25) after the first SFT run's test results surfaced
# two real bugs (NAME_1/NAME_2 placeholder leakage, no model identity) and
# a real gap (zero Hinglish data) -- see PROGRESS.md. Dataset grew to
# 549101 pairs at that point.
#
# RESCALED AGAIN (2026-08-27) after that run's own test results showed
# identity still inconsistent (lm_sys's 161K real chat logs drowned the
# 540-pair identity set) plus arithmetic and general factual recall got
# WORSE (diluted by the 44% dataset growth at the same 2 epochs). Fixed in
# prepare_sft.py: lm_sys capped at 20K pairs/language (was ~161K combined),
# identity oversampled 50x instead of 3x (9000 pairs), and a new synthetic
# arithmetic set added (7880 pairs). Net effect: dataset SHRANK to 445754
# train pairs despite adding two new sources, because the lm_sys cut was
# bigger than what got added.
#
# max_steps still sized for 2 EPOCHS: 445754/4 ~= 111438 steps/epoch * 2
# ~= 222876. warmup_steps scaled proportionally from the same ~1.57% ratio
# used the last two rescales -> 222876*0.0157 ~= 3500.
#
# At the second run's measured rate (~0.52-0.54s/step, this instance) this
# is ~222876*0.53s ~= 32.8hr -- similar to before despite fewer steps,
# since per-step time crept up over that run (0.41s early -> 0.54s late).
# Recalibrate off the first few hundred steps' logged elapsed time.
#
# RESCALED AGAIN (2026-08-30) -- FRESH init this time (--init-checkpoint,
# not --resume), from the new full-epoch pretrain checkpoint (60%-scale-up
# corpus, 1,158,613 steps). Not a continuation, so no lr_max_steps field
# needed here -- start_step=0 for a fresh run means (step - start_step)
# already equals step, same as before the resume-schedule fix existed.
# Dataset grew slightly (445754 -> 452516 pairs) from the identity
# question-phrasing expansion (180 -> 318 unique identity pairs, added
# after testing showed indirect/embedded phrasings weren't covered).
# max_steps: 452516/4 ~= 113129 steps/epoch * 2 ~= 226258. warmup_steps
# scaled by the same ~1.57% ratio -> 226258*0.0157 ~= 3552, rounded 3550.
#
# Expect ~0.18-0.19s/step with --amp --compile (same architecture/batch/
# block config as the pretrain run that measured this) -- recalibrate off
# the first real log lines rather than trusting this blindly, per usual.
#
# checkpoint_interval=25000 -> ceil(226258/25000)=10 step_*.pt files +
# 1 latest.pt = 11 files * ~8.25GB = ~90.75GB. Check free disk before
# starting -- this instance was at 60GB free as of the last check, with
# ~19 old pretrain snapshots (~150GB+) still pending cleanup. Same
# backup-then-delete discipline once a checkpoint is verified backed up.

train_data: "data/sft/train.jsonl"
val_data: "data/sft/val.jsonl"

batch_size: 4               # matches 500M's safe scale (4*1024=4096 tokens/step)
max_steps: 226258           # ~2 epochs over 452516 pairs at batch_size 4
eval_interval: 1500
eval_iters: 20
log_interval: 1500

learning_rate: 5.0e-5        # ~6x smaller than pretraining LR -- fine-tune, don't relearn
min_lr: 5.0e-6
warmup_steps: 3550
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_500m_sft"
checkpoint_interval: 25000
