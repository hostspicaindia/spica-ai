# Spica AI - SFT (instruction-tuning) config, 100M tier
# Same idea as sft_config.yaml (10M tier) but sized for the 100M
# checkpoint's block_size=512 (vs 10M's 256). batch_size dropped 16 -> 8
# to keep tokens/step at 4096 (8*512), matching the known-safe scale --
# reusing the 10M config's batch_size=16 here OOM'd immediately (16*512=
# 8192 tokens/step, 2x the safe scale, same class of bug as the original
# pretraining-config OOM: cross_entropy's logits tensor scales with
# batch*block_size*vocab_size regardless of which config it came from).
#
# First run (max_steps=32000, ~5 epochs over the 50935-pair Alpaca-only
# set) produced a degenerate repetition loop ("first line of the first
# line...") -- overfitting on a small, templated (GPT-generated) dataset,
# not undertraining. Data expanded to 382179 pairs (Alpaca + Dolly +
# AI4Bharat Indic-Instruct, ~155K of it genuinely Hindi) via
# prepare_sft.py. max_steps rescaled for batch8 to cover 3 epochs over
# the new set (382179/8 ~= 47772 steps/epoch * 3 ~= 143317, rounded to
# 143000) -- fewer epochs than before since the bigger, more diverse
# data needs less repetition to cover, and repetition is exactly what
# caused the earlier overfitting.
# checkpoint_interval=15000 -> ~10 files * ~2.6GB ~= 26GB.

train_data: "data/sft/train.jsonl"
val_data: "data/sft/val.jsonl"

batch_size: 8              # matches 100M pretraining's safe scale (8*512=4096 tokens/step)
max_steps: 143000          # ~3 epochs over 382179 pairs at batch_size 8
eval_interval: 1500
eval_iters: 20
log_interval: 1500

learning_rate: 5.0e-5      # ~6x smaller than pretraining LR -- fine-tune, don't relearn
min_lr: 5.0e-6
warmup_steps: 2500
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_100m_sft"
checkpoint_interval: 15000
