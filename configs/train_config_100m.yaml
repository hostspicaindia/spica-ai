# Spica AI - Training config (100M-tier, full run)
# DDP on 2x RTX 5090 tested and abandoned -- PHB (host-bridge-routed,
# no NVLink) interconnect made 2-GPU throughput WORSE than single-GPU
# (0.519s/step vs 0.1578s/step measured). RTX 5090 is a consumer card
# with no NVLink at all, so this isn't fixable by picking a different
# 2x5090 host -- back to plain single-GPU for this tier.
#
# Re-verified on this new instance: 0.1554s/step, val_loss 3.29->1.91
# in 5000 steps -- matches the original calibration closely. Restored
# to the full-run sizing: 300000 steps (~2.33 epochs over the 528M-token
# corpus, ~13hr at 0.1554s/step). checkpoint_interval=60000 -> 5 files *
# ~2.6GB ~= 13GB, safe on this instance's 100GB disk.

batch_size: 8
max_steps: 300000        # ~2.33 epochs, ~13hr at measured 0.1554s/step
eval_interval: 500
eval_iters: 50
log_interval: 1000

learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 500
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_100m"
checkpoint_interval: 60000
