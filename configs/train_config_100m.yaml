# Spica AI - Training config (100M-tier, full run)
# Calibration (5000 steps) measured ~0.1578s/step, no OOM, val_loss
# 3.24->1.88 still descending -- already ahead of the 10M tier's
# calibration result (2.03) at the same step count. max_steps sized to
# 300000 (~2.33 epochs over the 528M-token corpus, ~13.2hr wall-clock) --
# past the steep part of the loss curve (10M tier's rate of improvement
# slowed noticeably after ~250k-300k steps on the same data) without
# chasing the long flat tail.
#
# checkpoint_interval=60000 -> 5 files * ~2.6GB ~= 13GB, safe within the
# 26GB free after cleaning up the 10M tier's intermediate checkpoints.

batch_size: 8
max_steps: 300000        # ~2.33 epochs, ~13.2hr at measured 0.1578s/step
eval_interval: 500
eval_iters: 50
log_interval: 1000

learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 500
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_100m"
checkpoint_interval: 60000
