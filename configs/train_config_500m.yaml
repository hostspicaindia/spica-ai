# Spica AI - Training config (500M-tier, full run)
# Calibration (5000 steps) measured 0.468s/step, no OOM/crash after the
# pack_dataset + sampler RAM fixes. Data scaled to ~2.8B tokens (C4/mC4
# added) before this run -- ~28.4% of Chinchilla-optimal for the 493M
# body, a much healthier ratio than the pre-C4 683M-token corpus's 6.9%.
#
# max_steps=200000 (~29% of one epoch over 2.8B tokens, ~26hr at
# 0.468s/step) -- sized to a single realistic unattended push given
# repeated instance crashes/OOMs earlier this session, not a full epoch.
#
# checkpoint_interval=30000 is a deliberate safety tradeoff for an
# unattended run: checkpoints here are ~8.25GB EACH (687M total params
# * 4 bytes weights [~2.75GB] + AdamW optimizer state 2x [~5.5GB]).
# At interval 30000, ~6 step_*.pt files + 1 latest.pt ~= 57.75GB, safe
# on a 100GB disk with ~26GB already used by data. Denser checkpointing
# (e.g. 10000) would risk overflowing the disk (10 files ~= 82.5GB +
# 26GB data > 100GB) -- disk safety was prioritized over minimizing
# potential steps-lost-on-crash (worst case here: ~30000 steps, ~3.9hr).
#
# TEMPORARY (2026-08-28): bumped 200000 -> 205000 for a 5000-step
# calibration run on the scaled-up (60%-Chinchilla-optimal) corpus with
# --amp --compile, both used together for the first time. The existing
# checkpoint IS at step 200000 (max_steps), so resuming without raising
# this first would loop zero times. Recalculate to the real target
# once pack_dataset.py confirms the new corpus's actual token count,
# same as every prior data-scale-up in this project.

batch_size: 4
max_steps: 205000        # TEMP: 200000 + 5000-step calibration only
eval_interval: 1000
eval_iters: 50
log_interval: 1000

learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 500
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_500m"
checkpoint_interval: 30000
