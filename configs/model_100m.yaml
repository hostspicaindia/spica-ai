# Spica AI - 100M tier
#
# "100M" refers to non-embedding (transformer body) params, same convention
# as model_1m.yaml / model_10m.yaml. Body params = ~99.62M by hand
# calculation (14 blocks * ~7.09M/block + pos_embed + ln_f). Qwen vocab
# (151,665) still forces a large tied-embedding table regardless of tier --
# at n_embd=768 that's ~116.5M, so real total params ~= 216.1M.
#
# block_size raised 256 -> 512 vs the 10M tier -- no dataset repack needed,
# same as the 1M->10M jump (block_size is only consumed at DataLoader
# read-time, see src/data/dataset.py).

vocab_size: 151665      # fixed by Qwen tokenizer, do not change
block_size: 512         # max context length (sequence length) in tokens
n_layer: 14              # number of transformer blocks
n_embd: 768               # embedding / hidden dimension
n_head: 12                # attention heads (head_dim = n_embd / n_head = 64)
dropout: 0.1
tied_embeddings: true    # output LM head reuses the token embedding matrix
bias: true                 # use bias terms in Linear/LayerNorm layers
