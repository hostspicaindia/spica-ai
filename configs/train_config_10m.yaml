# Spica AI - Training config (10M-tier, full run)
# Calibration run (5000 steps, single 1x RTX 5090 spot instance) measured
# ~0.063s/step and a healthy still-descending val_loss (3.24 -> 2.03),
# confirming batch_size=16 (4096 tokens/step, same scale as the 1M tier)
# fits comfortably in VRAM. max_steps sized to 500000 (~8.75hr wall-clock,
# ~4.6 epochs over the 528M-token corpus) -- at this instance's $0.015/hr
# cost is a non-issue, time and data-repetition are the real constraints.
# checkpoint_interval widened 1000 -> 25000 (20 files * ~828MB ~= 16.6GB,
# safe on this instance's 32GB disk alongside data + deps).

batch_size: 16
max_steps: 500000       # full run, ~8.75hr at measured 0.063s/step
eval_interval: 500      # run validation loss every N steps
eval_iters: 50          # average val loss over this many batches
log_interval: 1000      # print training loss every N steps

learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 500
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_10m"
checkpoint_interval: 25000
