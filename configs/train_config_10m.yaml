# Spica AI - Training config (10M-tier, initial calibration run)
# Deliberately short (max_steps 5000) -- same approach as the 1M tier: run
# short first, measure real s/step on this bigger model + block_size=256,
# then extend max_steps once the actual throughput is known. Batch size
# raised vs the 1M tier (32 -> 64) -- dual RTX 5090 with 32GB VRAM each has
# huge headroom for a ~69M-param model.

batch_size: 64
max_steps: 5000         # calibration run -- extend once real s/step is known
eval_interval: 250      # run validation loss every N steps
eval_iters: 50          # average val loss over this many batches
log_interval: 100       # print training loss every N steps

learning_rate: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0

checkpoint_dir: "checkpoints/model_10m"
checkpoint_interval: 1000
